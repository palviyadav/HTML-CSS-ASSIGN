<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
     #hero {
        border: 2px solid blue;
        height: 230px;
        width: 900px;
        background-color: blue;
        border-radius: 10px;
        margin-left: 200px;
         margin-top: 10px;
        color: white;
        text-align: center;

        
        
        }
        .card{
            border: 1px solid black;
            border-radius: 10px;
            background-color: white;
            text-align: left;
            height: 200px;
            width: 900px;
            margin-top: 3px;
            margin-left: 200px;

        }
        table{
            width: 100%;
            border-collapse:collapse ;
            margin-top: 1px;

        }
        .registration{
            border:1px solid black;
            background-color: white;
            border-radius: 10px;
            width: 900px;
            height: 200px;
            margin-left: 200px;
            margin-top: 6px;

        }
        button{
            border:  solid white;
            background-color: blue;
            color: white;
            border-radius: 10px;
            width: 100px;
            height: 35px;
        }
        th{
            background-color: blue;
        }
        td{
            border: 1px solid black
        }
    </style>
</head>
<body>
    <div id="hero">
    <h1>coding club</h1>
    <p>Learn,Built,Share</p>
    </div>
    <br><br>
    <div class="card">
    <h2>Upcoming Event</h2>
    <table>
        <tr> <th>Event</th> <th>Date</th> <th>Venue</th></tr>
        <tr><td>Html Workshop</td> <td>12NOV</td> <td>Lab 1</td></tr>
        <tr><td>Hackathon</td> <td>20 Nov</td> <td>seminor Hall</td></tr>
    </table>
    </div>
    <div class=" registration">
        <h2> Register</h2>
        <p>name:<input type="name" placeholder="name"></p>
        <label for="name"></label>
        <p>Email:<input type="email" placeholder="you@example.com"></p>
        <label for="e mail"></label>
        <button>Register</button>
    </div>
    
</body>
</html>
